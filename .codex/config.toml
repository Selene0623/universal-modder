# Codex: project-scoped MCP (trusted projects).
#
# fal's hosted MCP server takes a bearer token. Don't paste the key here or commit a .env — store it once
# with `um fal key set` and export it for the agent's process:
#   export FAL_KEY="$(secret-tool lookup service fal.ai key api)"     # bash
#   set -x FAL_KEY (secret-tool lookup service fal.ai key api)        # fish
[mcp_servers.fal]
url = "https://mcp.fal.ai/mcp"
bearer_token_env_var = "FAL_KEY"
